name: APK derle
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q GameMon.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Derle
        working-directory: GameMon
        run: gradle assembleRelease --no-daemon
      - name: APK yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1
          files: GameMon/app/build/outputs/apk/release/*.apk
      
